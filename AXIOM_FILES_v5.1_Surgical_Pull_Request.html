<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOM FILES v5.1 — Surgical Pull Request</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:Consolas,Monaco,monospace}
header{background:#161b22;border-bottom:1px solid #30363d;padding:22px}
h1{color:#58a6ff;font-size:24px;margin-bottom:8px}.subtitle{color:#8b949e;font-size:13px}
.stats{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.badge{background:#21262d;border:1px solid #30363d;padding:6px 10px;border-radius:6px;font-size:12px}
main{padding:22px}#toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button{background:#238636;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit}button:hover{filter:brightness(1.1)}
#patch{border:1px solid #30363d;border-radius:8px;overflow:hidden;background:#0d1117}
.line{white-space:pre-wrap;padding:2px 10px;font-size:13px}.diff{background:#161b22;color:#79c0ff;font-weight:bold;padding-top:8px;padding-bottom:8px}.hunk{background:#1b1f24;color:#d2a8ff;font-weight:bold}.add{background:#0f2d1f;color:#7ee787}.del{background:#341515;color:#ff7b72}.plushead{background:#0f2d1f;color:#7ee787;font-weight:bold}.minushead{background:#341515;color:#ff7b72;font-weight:bold}.context{color:#c9d1d9}
footer{padding:20px;color:#8b949e;font-size:12px;text-align:center}
</style></head><body>
<header><h1>AXIOM FILES v5.1 — Surgical Pull Request</h1>
<div class="subtitle">Integração do sistema de upload do <b>code.html</b> na arquitetura completa do AXIOM FILES.</div>
<div class="stats"><div class="badge">🟩 Adições</div><div class="badge">🟥 Remoções</div><div class="badge">🟪 Hunks</div><div class="badge">🔵 Arquivos</div></div></header>
<main><div id="toolbar"><button onclick="copyPatch()">Copiar Patch</button><button onclick="toggleWrap()">Quebra de Linha</button></div><div id="patch"></div></main>
<footer>AXIOM FILES v5.1 — Visualização HTML do Patch Git</footer>
<script>
const rawPatch="--- AXIOM_FILES_v4.0_STABLE.html\n+++ AXIOM_FILES_v5.1_FUSION.html\n@@ -222,7 +222,7 @@\n     </div>\n   </div>\n   <div class=\"status-bar\">\n-    <span>Λ X I O M FILES // LUA PÁLIDA // v4.0 · Stable</span>\n+    <span>Λ X I O M FILES // LUA PÁLIDA // v5.0 · Hybrid Upload</span>\n     <span id=\"statusTime\">—</span>\n   </div>\n </div>\n@@ -457,7 +457,7 @@\n }\n \n /* ========== RENDER ========== */\n-function renderCompleteBody(e){\n+async function await renderCompleteBody(e){\n   let html = '';\n   if(e.text) html += `<div style=\"margin-bottom:10px\">${esc(e.text).replace(/\\n/g,'<br>')}</div>`;\n   if(e.links && e.links.length){\n@@ -506,7 +506,7 @@\n     body = `<div class=\"axiom-restricted\">🔒 RESTRITO<br><small>Conteúdo protegido por senha</small><br><br>\n       <button class=\"btn btn-red btn-unlock\" data-id=\"${esc(e.id)}\">INSERIR SENHA</button></div>`;\n   } else if(e.type === 'complete'){\n-    body = renderCompleteBody(e);\n+    body = await renderCompleteBody(e);\n   } else if(e.type === 'image'){\n     const src = getObjectURL(e.media || e.content);\n     body = src ? `<img src=\"${esc(src)}\" onerror=\"this.parentNode.innerHTML='<div style=color:#a40000>Imagem inválida</div>'\">` : 'SEM IMAGEM';\n@@ -613,7 +613,7 @@\n     let html = `<div style=\"font-family:Orbitron,monospace;color:#00f0ff;margin-bottom:6px\">${icon(e.type)} ${esc(e.title)}</div>\n       <div style=\"font-size:10px;color:#666;margin-bottom:8px\">${fmt(e.timestamp)}</div>\n       <div style=\"margin-bottom:6px\"><span class=\"axiom-classification\" style=\"background:${color(e.color||'green')}\">${label(e.color||'green')}</span></div>`;\n-    if(e.type === 'complete') html += renderCompleteBody(e);\n+    if(e.type === 'complete') html += await renderCompleteBody(e);\n     else if(e.type === 'image'){\n       const src = getObjectURL(e.media || e.content);\n       if(src) html += `<img src=\"${esc(src)}\" style=\"max-width:100%;border:1px solid #444\">`;\n@@ -1100,6 +1100,23 @@\n   return __oldDelete(id);\n };\n \n+\n+function createMediaPreview(input,preview){\n+ let urls=[];\n+ input.addEventListener('change',()=>{\n+   urls.forEach(u=>URL.revokeObjectURL(u));urls=[];preview.innerHTML='';\n+   [...input.files].forEach(f=>{\n+     const u=URL.createObjectURL(f);urls.push(u);\n+     const d=document.createElement('div');\n+     if(f.type.startsWith('image/')) d.innerHTML=`<img src=\"${u}\" style=\"max-width:120px;max-height:120px\"><div>${f.name}</div>`;\n+     else if(f.type.startsWith('video/')) d.innerHTML=`<video controls src=\"${u}\" style=\"max-width:180px\"></video><div>${f.name}</div>`;\n+     else if(f.type.startsWith('audio/')) d.innerHTML=`<audio controls src=\"${u}\"></audio><div>${f.name}</div>`;\n+     else d.innerHTML=`📎 ${f.name}`;\n+     preview.appendChild(d);\n+   });\n+ });\n+}\n+\n function tick(){ document.getElementById('statusTime').textContent = new Date().toLocaleString('pt-BR'); }\n   tick(); setInterval(tick, 1000);\n }\n@@ -1108,6 +1125,7 @@\n   try{\n     await loadLocal();\n     bind();\n+[['newFile','mediaPreview'],['compImages','compImagesPreview'],['compAudio','compAudioPreview'],['compVideo','compVideoPreview'],['compFiles','compFilesPreview']].forEach(([i,p])=>{const I=document.getElementById(i),P=document.getElementById(p);if(I&&P)createMediaPreview(I,P);});\n ['newFile','compImages','compAudio','compVideo','compFiles'].forEach(id=>{const el=document.getElementById(id); if(!el)return; const p=el.parentElement; ['dragenter','dragover'].forEach(ev=>p.addEventListener(ev,e=>{e.preventDefault();p.classList.add('drop-hover')})); ['dragleave','drop'].forEach(ev=>p.addEventListener(ev,e=>{e.preventDefault();p.classList.remove('drop-hover')})); p.addEventListener('drop',e=>{if(e.dataTransfer.files.length){el.files=e.dataTransfer.files; el.dispatchEvent(new Event('change'));}});});\n     render();\n     window.addEventListener('beforeunload',()=>{\n";
const patch=document.getElementById("patch");let wrap=true;
function render(){patch.innerHTML="";rawPatch.split("\n").forEach(line=>{const div=document.createElement("div");div.className="line context";if(line.startsWith("diff --git"))div.className="line diff";else if(line.startsWith("@@"))div.className="line hunk";else if(line.startsWith("+++"))div.className="line plushead";else if(line.startsWith("---"))div.className="line minushead";else if(line.startsWith("+"))div.className="line add";else if(line.startsWith("-"))div.className="line del";div.textContent=line;patch.appendChild(div);});}
function copyPatch(){navigator.clipboard.writeText(rawPatch).then(()=>alert("Patch copiado."));}
function toggleWrap(){wrap=!wrap;document.querySelectorAll(".line").forEach(l=>{l.style.whiteSpace=wrap?"pre-wrap":"pre";});}
render();
</script></body></html>
